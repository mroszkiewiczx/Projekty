name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            set -e
            echo "📦 Deploying AI School v3..."

            # Configure git
            git config --global --add safe.directory /docker/aischool-v3

            # Initialize git if needed
            if [ ! -d "/docker/aischool-v3/.git" ]; then
              echo "📥 Initializing git repository..."
              cd /docker/aischool-v3
              git init
              git remote add origin https://github.com/mroszkiewiczx/Projekty.git
            fi

            cd /docker/aischool-v3

            echo "🔄 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "📥 Installing dependencies..."
            npm install --prefer-offline

            echo "🔨 Building application..."
            npm run build

            echo "🐳 Building Docker image..."
            docker build -t aischool-v3:latest \
              --build-arg NEXT_PUBLIC_SUPABASE_URL="${SUPABASE_URL}" \
              --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
              --build-arg NEXT_PUBLIC_APP_URL="${APP_URL}" \
              .

            echo "🔄 Restarting container..."
            docker compose down || true
            docker compose up -d

            echo "⏳ Waiting for container to start..."
            sleep 15

            echo "✅ Deployment complete!"
            docker logs aischool-v3 | tail -10
